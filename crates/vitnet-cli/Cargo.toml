[package]
name = "vitnet-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "vitnet"
path = "src/main.rs"

[dependencies]
blake3.workspace = true
getrandom = "0.3"
httparse = "1"
tempfile.workspace = true
ctrlc.workspace = true
clap.workspace = true
serde_json.workspace = true
serde.workspace = true
sysinfo.workspace = true
vitnet-core.workspace = true
vitnet-dgml.workspace = true
vitnet-metadata.workspace = true
vitnet-mstat.workspace = true
vitnet-report.workspace = true
vitnet-attribution.workspace = true

[target.'cfg(windows)'.dependencies]
mimalloc.workspace = true
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { version = "1", features = ["io-util", "net", "rt", "sync", "time"] }

[dev-dependencies]
tempfile = "3.27"

[lints]
workspace = true
