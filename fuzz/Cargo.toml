[package]
name = "vitnet-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
vitnet-dgml = { version = "0.1.0", path = "../crates/vitnet-dgml" }
vitnet-metadata = { version = "0.1.0", path = "../crates/vitnet-metadata" }
vitnet-mstat = { version = "0.1.0", path = "../crates/vitnet-mstat" }
vitnet-attribution = { version = "0.1.0", path = "../crates/vitnet-attribution" }
serde_json = "1.0"

[[bin]]
name = "metadata_decoder"
path = "fuzz_targets/metadata_decoder.rs"
test = false
doc = false
bench = false

[[bin]]
name = "attribution_evidence"
path = "fuzz_targets/attribution_evidence.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mstat_summary"
path = "fuzz_targets/mstat_summary.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dgml_stats"
path = "fuzz_targets/dgml_stats.rs"
test = false
doc = false
bench = false
