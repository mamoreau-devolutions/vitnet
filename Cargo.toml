[workspace]
members = [
    "crates/vitnet-core",
    "crates/vitnet-dgml",
    "crates/vitnet-mstat",
    "crates/vitnet-metadata",
    "crates/vitnet-report",
    "crates/vitnet-cli",
    "crates/vitnet-attribution",
]
resolver = "2"
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/mamoreau-devolutions/vitnet"

[workspace.dependencies]
blake3 = "1.8"
clap = { version = "4.5", features = ["derive"] }
criterion = "0.7"
ctrlc = "3.4"
fs4 = "1.1"
fst = "0.4"
mmap-guard = "0.2"
memchr = "2.8"
mimalloc = "=0.1.52"
proptest = "1.6"
quick-xml = "=0.42.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
thiserror = "2.0"
tempfile = "3.15"
zip = { version = "6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
vitnet-core = { version = "0.1.0", path = "crates/vitnet-core" }
vitnet-dgml = { version = "0.1.0", path = "crates/vitnet-dgml" }
vitnet-mstat = { version = "0.1.0", path = "crates/vitnet-mstat" }
vitnet-metadata = { version = "0.1.0", path = "crates/vitnet-metadata" }
vitnet-report = { version = "0.1.0", path = "crates/vitnet-report" }
vitnet-attribution = { version = "0.1.0", path = "crates/vitnet-attribution" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
